[project]
name = "ai-product-scanner-mvp"
version = "0.1.0"
description = "AR-powered smart shopping cart — scan products, skip the queue."
readme = "README.md"
authors = [
    { name = "houssam01194", email = "admihoussamss@gmail.com" }
]
requires-python = ">=3.11"

dependencies = [
    # Web framework & server
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",

    # Database & ORM
    "sqlalchemy>=2.0,<3",

    # Settings & validation
    "pydantic-settings>=2.4,<3",
    "email-validator>=2.0",

    # Configuration
    "pyyaml>=6.0",

    # Auth & security
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",

    # Image processing
    "pillow>=10",
    "opencv-python>=4.9",
    "numpy>=1.26",

    # AI / Vision models
    "ultralytics>=8.3",
    "open-clip-torch>=2.26",
    "torch>=2.2",
    "torchvision>=0.17",

    # OCR & barcode
    "pytesseract>=0.3.10",
    "pyzbar>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",        # async test client for FastAPI
    "ruff>=0.4",          # linter & formatter
]

[project.scripts]
start = "app.main:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
